<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--#echo var="__INJECT_SCRIPT_TAG__" encoding="none"-->

    <script nonce='<!--#echo var="cspNonce"-->'>
      __webpack_nonce__ = '<!--#echo var="cspNonce"-->';
      // Set global for compatibility reason.
      // globalThis ?? window is required to make with work in  all environments (dev / prod).
      global = globalThis ?? window;
    </script>

    <script nonce='<!--#echo var="cspNonce"-->'>
      (function () {
        var environment = {};
        var encoded = window.__ENVIRONMENT__;

        if (typeof encoded === 'string' && !encoded.match(/^{{.*}}$/)) {
          try {
            environment = JSON.parse(atob(encoded));
          } catch (error) {
            console.warn(
              'window.__ENVIRONMENT__ has an unexpected format',
              encoded,
            );
          }
        }

        var appearance = environment.REACT_APP_APPEARANCE || 'neoboard';

        var icons = [
          {
            rel: 'icon',
            type: 'image/png',
            sizes: '32x32',
            href:
              environment.REACT_APP_FAVICON_32 || '/' + appearance + '-32.png',
          },
          {
            rel: 'icon',
            type: 'image/png',
            sizes: '16x16',
            href:
              environment.REACT_APP_FAVICON_16 || '/' + appearance + '-16.png',
          },
          {
            rel: 'apple-touch-icon',
            sizes: '180x180',
            href:
              environment.REACT_APP_APPLE_TOUCH_ICON ||
              '/' + appearance + '-apple-touch-icon.png',
          },
        ];

        icons.forEach(function (icon) {
          var link = document.createElement('link');
          link.setAttribute('rel', icon.rel);
          if (icon.type) {
            link.setAttribute('type', icon.type);
          }
          link.setAttribute('sizes', icon.sizes);
          link.setAttribute('href', icon.href);
          document.head.appendChild(link);
        });
      })();
    </script>

    <script nonce='<!--#echo var="cspNonce"-->' type="module">
      // Copy environment variables to process.env for backward compatibility with CRA.
      //
      // These are deliberately set here, and not in main.tsx, because the NeoBoard React
      // SDK reads some of these flags at module scope.
      //
      // Precedence, highest first:
      //   1. the container environment (window.__ENVIRONMENT__, read first by
      //      getEnvironment()), so deployments can still opt out
      //   2. a local .env / .env.local file, via import.meta.env
      //   3. the defaults below
      //
      // Keep in sync with the defaults in src/setupTests.ts.
      window.process = window.process ?? {};
      window.process.env = Object.assign(
        {
          REACT_APP_INFINITE_CANVAS: 'true',
          REACT_APP_RTC: 'matrixrtc',
          REACT_APP_EMBEDDED: 'true',
        },
        import.meta.env,
      );
    </script>

    <style nonce='<!--#echo var="cspNonce"-->'>
      #root {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
