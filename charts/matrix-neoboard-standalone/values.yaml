#   value: "NeoBoard"
# # optional: The appearance to use, either "neoboard" or "opendesk"
# - name: REACT_APP_APPEARANCE
#   value: "opendesk"
# # optional: Icon overrides. Default to the icons bundled for the configured appearance.
# # Externally hosted icons require their origin to be allowed by the img-src directive
